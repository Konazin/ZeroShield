[workspace]
resolver = "2"
members = [
    "crates/zs-core",
    "crates/zs-ipc",
    "crates/zs-scan",
    "crates/zs-proc",
    "crates/zs-net",
    "crates/zs-watch",
    "crates/zs-report",
    "crates/zs-tui",
    "crates/zs-cli",
    "crates/zs-daemon",
    "crates/zs-gui",
]
# The GUI requires GTK4/libadwaita system libraries, so it is not built by
# default. Build it explicitly with: cargo build -p zs-gui
default-members = [
    "crates/zs-core",
    "crates/zs-ipc",
    "crates/zs-scan",
    "crates/zs-proc",
    "crates/zs-net",
    "crates/zs-watch",
    "crates/zs-report",
    "crates/zs-tui",
    "crates/zs-cli",
    "crates/zs-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Konazin/ZeroShield"
homepage = "https://github.com/Konazin/ZeroShield"
rust-version = "1.75"
authors = ["ZeroShield contributors"]

[workspace.dependencies]
zs-core = { path = "crates/zs-core" }
zs-ipc = { path = "crates/zs-ipc" }
zs-scan = { path = "crates/zs-scan" }
zs-proc = { path = "crates/zs-proc" }
zs-net = { path = "crates/zs-net" }
zs-watch = { path = "crates/zs-watch" }
zs-report = { path = "crates/zs-report" }
zs-tui = { path = "crates/zs-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
libc = "0.2"
hex = "0.4"
goblin = "0.10"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
clap = { version = "4", features = ["derive", "wrap_help"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ratatui = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "fs",
] }

[profile.release]
lto = "thin"
strip = true
