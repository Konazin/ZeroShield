# ZeroShield runtime directories (systemd-tmpfiles)
d /var/lib/zeroshield 0700 root root -
d /var/lib/zeroshield/quarantine 0700 root root -
# 0755 (socket itself is 0660 by default): allows reaching the socket when
# daemon.socket_mode opts into polkit-authorized non-root clients.
d /run/zeroshield 0755 root root -
