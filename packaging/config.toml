# ZeroShield configuration (example)
#
# Lookup order: $ZS_CONFIG > /etc/zeroshield/config.toml >
#               ~/.config/zeroshield/config.toml
# Every key is optional: missing keys keep their built-in defaults.

[general]
# tracing filter for the daemon: trace | debug | info | warn | error
log_level = "info"
# Emit JSON logs (handy for journald shipping / ELK).
log_json = false

[scanner]
recursive = true
follow_symlinks = false
# Files larger than this are skipped (bytes).
max_file_size = 536870912          # 512 MiB
# Minimum score for a file to be reported as a finding (0-100).
min_report_score = 20
# Automatically quarantine malicious files found during a scan.
quarantine = false
# Reuse hashes of unchanged files between scans (mtime based).
hash_cache = true
# Reuse the verdict of files already scanned clean (same size/mtime and
# same signature/rules version) without reading them again.
clean_cache = true
clean_cache_max_entries = 200000
clean_cache_ttl_secs = 604800      # 7 days
# Amount of each file inspected for content rules (bytes).
content_scan_max_bytes = 16777216  # 16 MiB
# Extra directories containing *.toml rule files.
rule_dirs = ["/usr/share/zeroshield/rules"]
exclude_dirs = [".git", "node_modules", "__pycache__"]

[watch]
# Real-time file watching (inotify). When enabled, the daemon starts a
# session for every directory in `paths` at boot; new and changed files are
# scanned as they settle.
enabled = false
paths = ["/home", "/tmp"]
quarantine = false
recursive = true
# Quiet period after the last write before a file is scanned (milliseconds).
debounce_ms = 800

[automount]
# Scan removable media automatically when it is mounted (the daemon polls
# /proc/mounts; no udev/udisks dependency).
enabled = false
poll_interval_secs = 5
roots = ["/media", "/run/media", "/mnt"]
quarantine = false

[procmon]
# /proc polling watcher for potentially malicious processes.
enabled = true
poll_interval_secs = 5
# Minimum score for a process to raise an alert (0-100).
alert_score = 40
# Report every new process, not only suspicious ones (debugging).
report_all_new = false

[netguard]
# Embedded IPS. Starts disabled and in audit mode: nothing is blocked
# until you opt in with mode = "block" AND run `zeroshield net apply --yes`
# as root.
enabled = false
mode = "audit"                     # audit | block
nft_table = "zeroshield"
feed_cache_ttl_secs = 21600        # 6 hours
feed_urls = [
    "https://feodotracker.abuse.ch/downloads/ipblocklist.txt",
    "https://sslbl.abuse.ch/blacklist/sslipblacklist.txt",
    "https://rules.emergingthreats.net/blockrules/compromised-ips.txt",
    "https://urlhaus.abuse.ch/downloads/text/",
]
# Require a detached GPG signature (<feed_url>.asc) for every feed before it
# may replace the cache. Recommended; disabled by default for easy migration.
# A missing/invalid signature discards the download and keeps the previous
# rules (fail-closed).
feed_signature_required = false
# Public keyring used by gpgv to verify feed signatures (binary export:
# `gpg --export > /etc/zeroshield/feeds.gpg`).
feed_keyring = "/etc/zeroshield/feeds.gpg"
# DNS sinkhole fragment generation: off | dnsmasq | unbound.
dns_mode = "off"
dnsmasq_dir = "/etc/dnsmasq.d"
unbound_dir = "/etc/unbound/unbound.conf.d"
# Never blocked (IPs, CIDRs or domains).
allowlist = []
# Always blocked, in addition to the feeds (IPs, CIDRs or domains).
blocklist = []

[storage]
# Override the SQLite database location (default: <data_dir>/zeroshield.db).
# path = "/var/lib/zeroshield/zeroshield.db"

[daemon]
# Client authorization for the daemon socket (M9-C). The daemon always
# trusts root and its own user; identity comes from the kernel
# (SO_PEERCRED), never from client-supplied data.
# Extra uids/gids with full access and no polkit prompt (gids cover the
# primary group and supplementary groups).
client_uids = []
client_gids = []
# Ask polkit for untrusted local users instead of denying them:
# `pkcheck --action-id org.zeroshield.{read,manage} --process <pid>,<start>,<uid>`.
# Requests are denied when polkit is unreachable (fail-closed).
polkit_enabled = true
polkit_helper = "pkcheck"
# Let polkit open an authentication agent (GUI password prompts). Off by
# default so checks never block waiting for input.
# polkit_allow_interaction = true
# Socket permissions (octal). "0660" = owner only (default). Set "0666"
# together with polkit to let any local user attempt a request; every
# untrusted request is then authorized individually.
socket_mode = "0660"
