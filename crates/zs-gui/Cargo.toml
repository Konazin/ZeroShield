[package]
name = "zs-gui"
description = "ZeroShield GTK4 desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "zeroshield-gui"
path = "src/main.rs"

[dependencies]
zs-core.workspace = true
zs-ipc.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-channel = "2"
# Crates are imported as `gtk::` / `adw::` (gtk-rs naming convention).
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9" }
glib = "0.22"
