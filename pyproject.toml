[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroshield-sdk"
version = "0.1.0"
description = "ZeroShield daemon client SDK and automation layer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ZeroShield contributors" }]
keywords = ["antivirus", "security", "linux", "zeroshield"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Konazin/ZeroShield"

[project.scripts]
zeroshield-sdk = "zeroshield_sdk.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["zeroshield_sdk"]
